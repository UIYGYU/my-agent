name: my-agent-db
services:
  neo4j:
    image: neo4j@sha256:eabfbb042bdaca2fd5e1950db1329b22c794eee80f0eacc4e7a729d44b2e863f
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_server_bolt_advertised__address: "127.0.0.1:7687"
      NEO4J_server_http_advertised__address: "127.0.0.1:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
volumes:
  neo4j_data:
    external: true
    name: neo4j_data
  neo4j_logs:
    external: true
    name: neo4j_logs
